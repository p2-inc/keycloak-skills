# skillsaw configuration
# See https://github.com/stbenjam/skillsaw for more information

# Pin to the skillsaw version this config targets so rules added in later
# versions are enabled.
version: "0.18.0"

# Enable/disable rules with configurable severity levels
rules:
  # Context budget. skillsaw 0.19 defaults the `skill` category to warn at 3,000
  # tokens; both shipped skills sit above that and were previously carried by
  # ceiling entries in .skillsaw-baseline.json (keycloak 3,815 / securing-apps
  # 3,022). The keycloak router grew past its ceiling when the tooling=mcp
  # verification step was added, which turned a suppressed warning into a CI
  # failure.
  #
  # Raised rather than trimmed: the router is a dispatch table plus the
  # diagnostics needed to avoid a wrong turn, and the content earning the tokens
  # is the part that stops an agent thrashing. Keep an eye on it — the real
  # forcing function is still the 1024-char frontmatter description limit, which
  # will eventually require splitting this skill rather than growing it.
  context-budget:
    limits:
      skill:
        warn: 4500
        error: 8000

  # Plugin Structure
  plugin-json-required:
    enabled: true
    severity: error

  plugin-json-valid:
    enabled: true
    severity: error

  plugin-naming:
    enabled: true
    severity: warning

  plugin-readme:
    enabled: true
    severity: warning

  # Marketplace (auto on marketplace repos)
  marketplace-json-valid:
    enabled: auto
    severity: error

  marketplace-registration:
    enabled: auto
    severity: error

  # Skills
  # NOTE: skill-frontmatter is deprecated since skillsaw 0.18.0 in favor of
  # agentskill-valid (auto-enabled by default for this repo type, same checks,
  # no config needed) - intentionally not re-enabled here to avoid duplicate
  # reporting of the same violations.

  # Custom: Enforce Agent Skills specification directory structure
  skill-directory-structure:
    enabled: true
    severity: error

  # Custom: Enforce that all skills are documented in plugin README.md
  skill-readme-documentation:
    enabled: true
    severity: error

  # Custom: Enforce kebab-case naming for markdown files in skills/
  skill-markdown-naming:
    enabled: true
    severity: error

  # Custom: Enforce license and metadata.author in SKILL.md frontmatter
  skill-required-metadata:
    enabled: true
    severity: error

  # This repo now ships three plugin surfaces — .claude-plugin, .codex-plugin
  # and .cursor-plugin. None of them is OpenClaw: these rules validate a
  # metadata.openclaw installer block (brew/node/go/uv/download + OS gating)
  # for the OpenClaw runtime, which we do not target. Keep disabled unless we
  # actually publish for OpenClaw.
  skill-openclaw-metadata:
    enabled: false

  openclaw-metadata:
    enabled: false

# Custom rules for marketplace-specific validation
  # Bundled authentication-flow assets: distinct sibling priorities, bucket-pure
  # levels, and an enabled condition inside every CONDITIONAL sub-flow. All three
  # are silent failures at runtime - Keycloak accepts the shape and misbehaves at
  # login - so they are errors here.
  auth-flow-asset-valid:
    enabled: true
    severity: error

custom-rules:
  - ./.skillsaw/rules.py

# Exclusions
exclude:
- "**/node_modules/**"
- "**/.git/**"
- "**/dist/**"
- "**/build/**"
- "**/.venv/**"
- "**/__pycache__/**"
- "**/*.min.*"
- "**/*.lock"
- "**/.DS_Store"
- "**/.idea/**"
- "**/.vscode/**"
- "**/coverage/**"
- "**/tmp/**"
- "**/tests/fixtures/**"    # allow test data to be messy
- "**/examples/**"          # sample code often incomplete
- "benchmarks/**"           # external skillsbench task defs, not plugin content

# Strict mode
strict: true
