    <script type="module">
        import { startSessionPolling } from "/auth/resources/20d2w/login/keycloak.v2/js/authChecker.js";

        startSessionPolling(
            "/auth/realms/acme/login-actions/restart?client_id=acme-portal&tab_id=JTOjvJ1JOD0&client_data=eyJydSI6Imh0dHA6Ly9sb2NhbGhvc3Q6OTk5OS9jYWxsYmFjayIsInJ0IjoiY29kZSIsInN0IjoidmVyaWZ5LW1haWwtcHJpeWEifQ&skip_logout=true"
        );

        const DARK_MODE_CLASS = "pf-v5-theme-dark";
        const mediaQuery =window.matchMedia("(prefers-color-scheme: dark)");
        updateDarkMode(mediaQuery.matches);
        mediaQuery.addEventListener("change", (event) =>
          updateDarkMode(event.matches),
        );
        function updateDarkMode(isEnabled) {
          const { classList } = document.documentElement;
          if (isEnabled) {
            classList.add(DARK_MODE_CLASS);
          } else {
            classList.remove(DARK_MODE_CLASS);
          }
        }
    </script>
