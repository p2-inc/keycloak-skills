<!DOCTYPE html>
<html class="login-pf">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="robots" content="noindex, nofollow">

            <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Sign in to Acme Portal</title>
    <link rel="icon" href="/auth/resources/m8zuz/login/keycloak.v2/img/favicon.ico" />
            <link href="/auth/resources/m8zuz/common/keycloak/vendor/patternfly-v5/patternfly.min.css" rel="stylesheet" />
            <link href="/auth/resources/m8zuz/common/keycloak/vendor/patternfly-v5/patternfly-addons.css" rel="stylesheet" />
            <link href="/auth/resources/m8zuz/login/keycloak.v2/css/styles.css" rel="stylesheet" />
    <script type="importmap">
        {
            "imports": {
                "rfc4648": "/auth/resources/m8zuz/common/keycloak/vendor/rfc4648/rfc4648.js"
            }
        }
    </script>
    <script type="module" src="/auth/resources/m8zuz/login/keycloak.v2/js/passwordVisibility.js"></script>
    <script type="module">
        import { startSessionPolling } from "/auth/resources/m8zuz/login/keycloak.v2/js/authChecker.js";

        startSessionPolling(
            "/auth/realms/acme/login-actions/restart?client_id=acme-portal&tab_id=T6otbRstZRI&client_data=eyJydSI6Imh0dHA6Ly9sb2NhbGhvc3Q6OTk5OS9jYWxsYmFjayIsInJ0IjoiY29kZSIsInN0IjoidmVyaWZ5LW5vLXBhc3N3b3JkIn0&skip_logout=true"
        );

        const DARK_MODE_CLASS = "pf-v5-theme-dark";
        const mediaQuery =window.matchMedia("(prefers-color-scheme: dark)");
        updateDarkMode(mediaQuery.matches);
        mediaQuery.addEventListener("change", (event) =>
          updateDarkMode(event.matches),
        );
        function updateDarkMode(isEnabled) {
          const { classList } = document.documentElement;
          if (isEnabled) {
            classList.add(DARK_MODE_CLASS);
          } else {
            classList.remove(DARK_MODE_CLASS);
          }
        }
    </script>
</head>

<body id="keycloak-bg" class="">

<div class="pf-v5-c-login">

        Sign in to your account

</h1>
      </div>
      <div class="pf-v5-c-login__main-body">


<!-- template: login-username.ftl -->

        <div id="kc-form">
            <div id="kc-form-wrapper">
                    <form id="kc-form-login" class="pf-v5-c-form" onsubmit="login.disabled = true; return true;" action="http://localhost:8080/auth/realms/acme/login-actions/authenticate?session_code=zR96FJq2GPvLnellZDvc4B-cI9y_r1hoCfSpDs1adOc&amp;execution=ec8b6783-3189-4d8e-a920-d5fbf9f85dca&amp;client_id=acme-portal&amp;tab_id=T6otbRstZRI&amp;client_data=eyJydSI6Imh0dHA6Ly9sb2NhbGhvc3Q6OTk5OS9jYWxsYmFjayIsInJ0IjoiY29kZSIsInN0IjoidmVyaWZ5LW5vLXBhc3N3b3JkIn0"

                            <div class="pf-v5-c-form__group">

<div class="pf-v5-c-form__group">
  <div class="pf-v5-c-form__label">

  </div>

    <span class="pf-v5-c-form-control ">
        <input id="username" name="username" value="" type="text" autocomplete="username" autofocus
                aria-invalid=""/>
    </span>

  <div id="input-error-client-username"></div>
</div>


                            </div>

                        <div class="pf-v5-c-form__group">
                        </div>

  <div class="pf-v5-c-form__group">
    <div class="pf-v5-c-form__actions">
  <button class="pf-v5-c-button pf-m-primary pf-m-block " name="login" id="kc-login" type="submit">Sign In</button>
    </div>
  </div>
                    </form>
            </div>
        </div>



          <form id="kc-select-try-another-way-form" action="http://localhost:8080/auth/realms/acme/login-actions/authenticate?session_code=zR96FJq2GPvLnellZDvc4B-cI9y_r1hoCfSpDs1adOc&amp;execution=ec8b6783-3189-4d8e-a920-d5fbf9f85dca&amp;client_id=acme-portal&amp;tab_id=T6otbRstZRI&amp;client_data=eyJydSI6Imh0dHA6Ly9sb2NhbGhvc3Q6OTk5OS9jYWxsYmFjayIsInJ0IjoiY29kZSIsInN0IjoidmVyaWZ5LW5vLXBhc3N3b3JkIn0" method="post" novalidate="novalidate">

                    Try Another Way

      </div>
      <div class="pf-v5-c-login__main-footer">
<!-- template: login-username.ftl -->


      </div>
    </main>

  </div>
</div>
