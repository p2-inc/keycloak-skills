    <script type="module">
        import { startSessionPolling } from "/auth/resources/m8zuz/login/keycloak.v2/js/authChecker.js";

        startSessionPolling(
            "/auth/realms/acme/login-actions/restart?client_id=acme-portal&tab_id=riEVnq84NFU&client_data=eyJydSI6Imh0dHA6Ly9sb2NhbGhvc3Q6OTk5OS9jYWxsYmFjayIsInJ0IjoiY29kZSIsInN0IjoidmVyaWZ5LXBhc3NrZXkifQ&skip_logout=true"
        );

        const DARK_MODE_CLASS = "pf-v5-theme-dark";
        const mediaQuery =window.matchMedia("(prefers-color-scheme: dark)");
        updateDarkMode(mediaQuery.matches);
        mediaQuery.addEventListener("change", (event) =>
          updateDarkMode(event.matches),
        );
        function updateDarkMode(isEnabled) {
          const { classList } = document.documentElement;
          if (isEnabled) {
            classList.add(DARK_MODE_CLASS);
          } else {
            classList.remove(DARK_MODE_CLASS);
          }
        }
    </script>
<script> if (typeof history.replaceState === 'function') {  history.replaceState({}, "some title", "http://localhost:8080/auth/realms/acme/login-actions/authenticate?execution=1c69b610-0461-4715-990d-32c50025b91c&client_id=acme-portal&tab_id=riEVnq84NFU&client_data=eyJydSI6Imh0dHA6Ly9sb2NhbGhvc3Q6OTk5OS9jYWxsYmFjayIsInJ0IjoiY29kZSIsInN0IjoidmVyaWZ5LXBhc3NrZXkifQ"); }</script></head>

<body id="keycloak-bg" class="">

<div class="pf-v5-c-login">

</h1>

<!-- template: webauthn-autthenticate.ftl -->

            </form>

            <div class="pf-v5-c-form__group no-bottom-margin">

                <div id="kc-form-buttons" class="col-xs-12 col-sm-12 col-md-12 col-lg-12">

                </div>
            </div>
        </div>

    <script type="module">
        import { authenticateByWebAuthn } from "/auth/resources/m8zuz/login/keycloak.v2/js/webauthnAuthenticate.js";
        const authButton = document.getElementById('authenticateWebAuthnButton');
        authButton.addEventListener("click", function() {
            const input = {
                isUserIdentified : false,
                challenge : '_DUpFVlTRjaA71XAH4aeRA',
                userVerification : 'preferred',
                rpId : 'localhost',
                createTimeout : 0,
                errmsg : "WebAuthn is not supported by this browser. Try another one or contact your administrator."
            };
            authenticateByWebAuthn(input);
        });
    </script>
